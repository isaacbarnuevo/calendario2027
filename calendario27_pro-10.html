<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador: El Escudo de Invierno 2027</title>
    
    <!-- React & ReactDOM (Umd) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Lucide React (Umd fallback) -->
    <script src="https://cdn.jsdelivr.net/npm/lucide-react@0.344.0/dist/umd/lucide-react.js"></script>
    
    <!-- Babel (Stand-alone) -->
    <script src="https://unpkg.com/@babel/standalone@7.24.2/babel.min.js"></script>
    
    <!-- Tailwind CSS (Play CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
        .loading-screen { display: flex; align-items: center; justify-content: center; height: 100vh; background: #f1f5f9; }
        @media print {
          .no-print { display: none !important; }
          body { background: white !important; }
          .fixed { position: static !important; }
          @page { size: A4 landscape; margin: 1cm; }

        [data-theme="dark"] { filter: invert(0.88) hue-rotate(180deg); }
        [data-theme="dark"] img { filter: invert(1) hue-rotate(180deg); }
    </style>
</head>
<body class="bg-slate-100">
    <div id="root">
        <div class="loading-screen">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-slate-800 animate-pulse">Cargando Planificador...</h2>
                <p class="text-slate-500 mt-2">Transformando calendarios para 2027</p>
            </div>
        </div>
    </div>

    <script>
        window.onerror = function(msg, url, line, col, error) {
            const root = document.getElementById('root');
            if (root) {
                root.innerHTML = `<div style="padding:20px; color:red; font-family:sans-serif; background:#fee2e2; margin:20px; border-radius:10px; border:2px solid #ef4444;">
                    <h2 style="margin:0 0 10px 0;">Error de Aplicación</h2>
                    <p><b>Mensaje:</b> ${msg}</p>
                    <p style="font-size:12px; margin-top:10px;">Línea: ${line}:${col}</p>
                    <button onclick="location.reload()" style="background:#ef4444; color:white; border:none; padding:8px 16px; border-radius:5px; margin-top:10px; cursor:pointer; font-weight:bold;">Reintentar</button>
                </div>`;
            }
            return false;
        };

        // --- Data & Helpers (Moved from Babel to standard JS) ---
        const QUOTAS_INITIAL = {
            A: {
                1: { L: 0, SD: 0 }, 2: { L: 155, SD: 18 }, 3: { L: 155, SD: 18 }, 4: { L: 147, SD: 15 },
                5: { L: 147, SD: 15 }, 6: { q1: { L: 138, SD: 15 }, q2: { L: 86, SD: 10 } },
                7: { L: 82, SD: 10 }, 8: { L: 80, SD: 10 }, 9: { L: 84, SD: 10 },
                10: { L: 138, SD: 15 }, 11: { L: 120, SD: 10 }, 12: { L: 88, SD: 10 }
            }
        };

        const WEEK_DAYS  = ['L','M','X','J','V','S','D'];
        const MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

        const PATTERN_28_DAYS = [
            true, false,false,false,false,true, true,
            false,false,false,false,false,true, true,
            false,false,false,true, true, false,false,
            false,true, true, false,false,false,false
        ];

        const VACATIONS = {
            summer: [
                { id:'S1',  name:'Gr.1: 16/Jun - 15/Jul', m1:6,d1:16,m2:7, d2:15 },
                { id:'S2',  name:'Gr.2: 8/Ago - 30/Ago',  m1:8,d1:8, m2:8, d2:30 },
                { id:'S3',  name:'Gr.3: 1/Sep - 30/Sep',  m1:9,d1:1, m2:9, d2:30 },
                { id:'S4',  name:'Gr.4: 16/Jul - 7/Ago',  m1:7,d1:16,m2:8, d2:7  },
                { id:'S51', name:'Gr.51: 1/Ago - 30/Ago', m1:8,d1:1, m2:8, d2:30 },
                { id:'S52', name:'Gr.52: 1/Jul - 30/Jul', m1:7,d1:1, m2:7, d2:30 },
                { id:'S53', name:'Gr.53: 1/Sep - 30/Sep', m1:9,d1:1, m2:9, d2:30 }
            ],
            winter: [
                { id:'W11', name:'Gr.11: 18/Nov - 08/Dic', m1:11,d1:18,m2:12,d2:8  },
                { id:'W12', name:'Gr.12: 26/Oct - 15/Nov', m1:10,d1:26,m2:11,d2:15 },
                { id:'W21', name:'Gr.21: 24/Abr - 21/May', m1:4, d1:24,m2:5, d2:21 },
                { id:'W22', name:'Gr.22: 01/Ene - 28/Ene', m1:1, d1:1, m2:1, d2:28 },
                { id:'W23', name:'Gr.23: 25/Feb - 24/Mar', m1:2, d1:25,m2:3, d2:24 },
                { id:'W24', name:'Gr.24: 26/Mar - 22/Abr', m1:3, d1:26,m2:4, d2:22 },
                { id:'W31', name:'Gr.31: 23/May - 12/Jun', m1:5, d1:23,m2:6, d2:12 },
                { id:'W32', name:'Gr.32: 11/Dic - 31/Dic', m1:12,d1:11,m2:12,d2:31 },
                { id:'W52', name:'Gr.52: 3/Feb - 23/Feb',  m1:2, d1:3, m2:2, d2:23 }
            ]
        };

        function getEasterSunday(year) {
            const a = year % 19;
            const b = Math.floor(year / 100);
            const c = year % 100;
            const d = Math.floor(b / 4);
            const e = b % 4;
            const f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3);
            const h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4);
            const k = c % 4;
            const l = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * l) / 451);
            const month = Math.floor((h + l - 7 * m + 114) / 31);
            const day = ((h + l - 7 * m + 114) % 31) + 1;
            return new Date(year, month - 1, day);
        }

        const loadSet = k => { try { const s = localStorage.getItem(k); return s ? new Set(JSON.parse(s)) : new Set(); } catch { return new Set(); } };
        const saveSet = (k, s) => { try { localStorage.setItem(k, JSON.stringify([...s])); } catch {} };
        const loadVal = (k, def) => { try { const v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : def; } catch { return def; } };
    </script>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const Lucide = window.LucideReact || window.lucide || {};
        const { 
            Calendar = () => null, AlertTriangle = () => null, Info = () => null, 
            RefreshCw = () => null, Calculator = () => null, LayoutGrid = () => null, 
            PlaneTakeoff = () => null, Settings = () => null, Flame = () => null, 
            Zap = () => null, Users = () => null, Edit3 = () => null,
            XCircle = () => null, CheckCircle2 = () => null, ChevronDown = () => null,
            ChevronUp = () => null, Star = () => null, CalendarDays = () => null,
            Clock = () => null, Bell = () => null, CalendarCheck = () => null,
            Play = () => null, Printer = () => null, Download = () => null,
            Copy = () => null, Share2 = () => null, Moon = () => null,
            Sun = () => null, MessageSquare = () => null, AlertCircle = () => null,
            ChevronLeft = () => null, ChevronRight = () => null, FileText = () => null,
            FileUp = () => null
        } = Lucide;

        // Fallback for those that might have different naming convention
        const Undo2 = Lucide.Undo2 || Lucide.RotateCcw || (() => null);

        function App() {
          const [selectedYear,    setSelectedYear]  = useState(() => loadVal('pln_year', 2027));
          const [turn,            setTurn]          = useState(() => loadVal('pln_turn', 1));
          const [restGroup,       setRestGroup]     = useState(() => loadVal('pln_restGroup', 2));
          const [groupLastYear,   setGroupLastYear] = useState(() => loadVal('pln_groupLastYear', 3));
  const [subGroup5,       setSubGroup5]     = useState(() => loadVal('pln_subGroup5', 'S51'));
  const [winVac,          setWinVac]        = useState(() => loadVal('pln_winVac', 'W11'));
  const [requestedDays,   setRequestedDays] = useState(() => loadSet('pln_req'));
  
  const [showConfig,      setShowConfig]    = useState(false);
  const [clickMode,       setClickMode]     = useState('pedir'); // pedir | plan_a | plan_b | plan_c | vacaciones | agotar
  const [shiftPhase,      setShiftPhase]    = useState(() => loadVal('pln_shift', 'manana')); // manana | tarde
  
  const [customVacationDays, setCustomVacationDays] = useState(new Set());
  const [planA,           setPlanA]         = useState(() => loadSet('pln_planA'));
  const [planB,           setPlanB]         = useState(() => loadSet('pln_planB'));
  const [planC,           setPlanC]         = useState(() => loadSet('pln_planC'));
  const [exhaustedDays,   setExhaustedDays] = useState(() => loadSet('pln_exhausted'));
  const [errorMsg,        setErrorMsg]      = useState('');
  const [msgType,         setMsgType]       = useState('error'); // error | success | info

  const [appDay,          setAppDay]        = useState(() => loadVal('pln_appDay', 22));
  const [appTime,         setAppTime]       = useState(() => loadVal('pln_appTime', '10:00'));
  const [simMode,         setSimMode]       = useState('real');
  const [simOffset,       setSimOffset]     = useState(0);
  const [maqPerTurn,      setMaqPerTurn]    = useState(() => loadVal('pln_mpt', 160));
  const [manualMaqAhead,  setManualMaqAhead] = useState(() => loadVal('pln_mma', null));
  const [calcByApp,       setCalcByApp]      = useState(() => loadVal('pln_cba', false));
  const [appInterval,     setAppInterval]    = useState(() => loadVal('pln_api', 10));
  const [shiftStart,      setShiftStart]     = useState(() => loadVal('pln_ss', '10:00'));
  const [maqPerSlot,      setMaqPerSlot]     = useState(() => loadVal('pln_mps', 1));
  const [shiftHours,      setShiftHours]     = useState(() => loadVal('pln_sh', 5));
  const [calcRateByDur,   setCalcRateByDur]  = useState(() => loadVal('pln_cbd', true));
  const [now,             setNow]           = useState(new Date());

  useEffect(() => {
    const timer = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(timer);
  }, []);

  const [tooltip,      setTooltip]      = useState(null);
  const [lastClickKey, setLastClickKey] = useState(null);
  const [mobileMonth,  setMobileMonth]  = useState(new Date().getMonth() + 1);
  const [darkMode,     setDarkMode]     = useState(() => loadVal('pln_dark', false));
  const [notes,        setNotes]        = useState(() => loadVal('pln_notes', {}));
  const [noteModal,    setNoteModal]    = useState(null);
  const [history,      setHistory]      = useState([]);

  useEffect(() => saveSet('pln_req',       requestedDays), [requestedDays]);
  useEffect(() => saveSet('pln_planA',     planA),         [planA]);
  useEffect(() => saveSet('pln_planB',     planB),         [planB]);
  useEffect(() => saveSet('pln_planC',     planC),         [planC]);
  useEffect(() => saveSet('pln_exhausted', exhaustedDays), [exhaustedDays]);
  useEffect(() => localStorage.setItem('pln_year',  JSON.stringify(selectedYear)), [selectedYear]);
  useEffect(() => localStorage.setItem('pln_turn',  JSON.stringify(turn)),         [turn]);
  useEffect(() => localStorage.setItem('pln_rg',    JSON.stringify(restGroup)),    [restGroup]);
  useEffect(() => localStorage.setItem('pln_gly',   JSON.stringify(groupLastYear)),[groupLastYear]);
  useEffect(() => localStorage.setItem('pln_sg5',   JSON.stringify(subGroup5)),    [subGroup5]);
  useEffect(() => localStorage.setItem('pln_wv',    JSON.stringify(winVac)),       [winVac]);
  useEffect(() => localStorage.setItem('pln_ad',    JSON.stringify(appDay)),       [appDay]);
  useEffect(() => localStorage.setItem('pln_at',    JSON.stringify(appTime)),      [appTime]);
  useEffect(() => localStorage.setItem('pln_shift', JSON.stringify(shiftPhase)),   [shiftPhase]);
  useEffect(() => localStorage.setItem('pln_dark',  JSON.stringify(darkMode)),     [darkMode]);
  useEffect(() => localStorage.setItem('pln_notes', JSON.stringify(notes)),        [notes]);
  useEffect(() => localStorage.setItem('pln_mpt',   JSON.stringify(maqPerTurn)),   [maqPerTurn]);
  useEffect(() => localStorage.setItem('pln_mma',   JSON.stringify(manualMaqAhead)),[manualMaqAhead]);
  useEffect(() => localStorage.setItem('pln_cba',   JSON.stringify(calcByApp)),    [calcByApp]);
  useEffect(() => localStorage.setItem('pln_api',   JSON.stringify(appInterval)),  [appInterval]);
  useEffect(() => localStorage.setItem('pln_ss',    JSON.stringify(shiftStart)),   [shiftStart]);
  useEffect(() => localStorage.setItem('pln_mps',   JSON.stringify(maqPerSlot)),   [maqPerSlot]);
  useEffect(() => localStorage.setItem('pln_sh',    JSON.stringify(shiftHours)),   [shiftHours]);
  useEffect(() => localStorage.setItem('pln_cbd',   JSON.stringify(calcRateByDur)), [calcRateByDur]);

  // --- Share/Load Logic ---
  const applyState = (decoded) => {
    if (!decoded) return false;
    if (decoded.yr) setSelectedYear(decoded.yr);
    if (decoded.t)  setTurn(decoded.t);
    if (decoded.rg) setRestGroup(decoded.rg);
    if (decoded.gly) setGroupLastYear(decoded.gly);
    if (decoded.sg5) setSubGroup5(decoded.sg5);
    if (decoded.wv)  setWinVac(decoded.wv);
    if (decoded.sp)  setShiftPhase(decoded.sp);
    if (decoded.ad)  setAppDay(decoded.ad);
    if (decoded.at)  setAppTime(decoded.at);
    if (decoded.mpt) setMaqPerTurn(decoded.mpt);
    if (decoded.mma !== undefined) setManualMaqAhead(decoded.mma);
    if (decoded.cba !== undefined) setCalcByApp(decoded.cba);
    if (decoded.api) setAppInterval(decoded.api);
    if (decoded.ss)  setShiftStart(decoded.ss);
    if (decoded.mps) setMaqPerSlot(decoded.mps);
    if (decoded.sh)  setShiftHours(decoded.sh);
    if (decoded.cbd !== undefined) setCalcRateByDur(decoded.cbd);
    
    if (decoded.req) setRequestedDays(new Set(decoded.req));
    if (decoded.pa)  setPlanA(new Set(decoded.pa));
    if (decoded.pb)  setPlanB(new Set(decoded.pb));
    if (decoded.pc)  setPlanC(new Set(decoded.pc));
    if (decoded.ex)  setExhaustedDays(new Set(decoded.ex));
    if (decoded.nt)  setNotes(decoded.nt || {});
    return true;
  };

  useEffect(() => {
    try {
      const urlParams = new URLSearchParams(window.location.search);
      const planBase64 = urlParams.get('plan') || urlParams.get('p');
      if (planBase64) {
        const decoded = JSON.parse(decodeURIComponent(escape(atob(planBase64))));
        if (applyState(decoded)) {
          notify('Plan importado correctamente desde el enlace.', 'success');
        }
        const newUrl = window.location.pathname;
        window.history.replaceState({}, document.title, newUrl);
      }
    } catch (e) {
      console.error("Error loading shared plan:", e);
      showError('No se pudo cargar el plan compartido (enlace corrupto o antiguo).');
    }
  }, []);

  const importConfig = () => {
    const code = window.prompt("Pega aquí el CÓDIGO de configuración compartido:");
    if (!code) return;
    try {
      const decoded = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
      if (applyState(decoded)) {
        notify('Configuración importada con éxito.', 'success');
      } else {
        showError('El código no es válido o está incompleto.');
      }
    } catch (e) {
      showError('Error: El código pegado no es válido.');
    }
  };

  const pushHistory = () => setHistory(h => [...h.slice(-29), {
    r: new Set(requestedDays), a: new Set(planA), b: new Set(planB),
    cp: new Set(planC), ex: new Set(exhaustedDays)
  }]);
  const undo = React.useCallback(() => setHistory(h => {
    if (!h.length) return h;
    const last = h[h.length-1];
    setRequestedDays(last.r); setPlanA(last.a); setPlanB(last.b);
    setPlanC(last.cp); setExhaustedDays(last.ex);
    return h.slice(0,-1);
  }), []);
  useEffect(() => {
    const fn = e => { if ((e.ctrlKey||e.metaKey) && e.key==='z') { e.preventDefault(); undo(); } };
    window.addEventListener('keydown', fn);
    return () => window.removeEventListener('keydown', fn);
  }, [undo]);

  const effectiveNow = new Date(now.getTime() + simOffset);

  const simulateTo = (mode) => {
    if (mode === 'real') { setSimOffset(0); setSimMode('real'); return; }
    let target;
    const currentYear = selectedYear;
    if (mode === 'jan15') target = new Date(currentYear, 0, 15, 12, 0);
    else if (mode === 'jan22_pre') {
       const [h,m] = appTime.split(':');
       target = new Date(currentYear, 0, appDay, parseInt(h), parseInt(m) - 4);
    }
    else if (mode === 'jan22_in') {
       const [h,m] = appTime.split(':');
       target = new Date(currentYear, 0, appDay, parseInt(h), parseInt(m) + 2);
    }
    else if (mode === 'jan29') target = new Date(currentYear, 0, 29, 10, 0);
    
    setSimOffset(target.getTime() - new Date().getTime());
    setSimMode(mode);
  };

  const targetCita = new Date(selectedYear, 0, appDay, parseInt(appTime.split(':')[0]), parseInt(appTime.split(':')[1]));
  const msToCita = targetCita.getTime() - effectiveNow.getTime();
  
  const isPreAccess = msToCita <= 300000 && msToCita > 0;
  const isActiveTurn = msToCita <= 0 && msToCita > -600000;
  
  const formatMs = (ms) => {
    const abs = Math.abs(ms);
    const m = Math.floor(abs / 60000);
    const s = Math.floor((abs % 60000) / 1000);
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  };

  const optPositions = 13;
  const currentTurn  = Math.min(turn, optPositions);

  useEffect(() => { if (turn > optPositions) setTurn(optPositions); }, [optPositions, turn]);

  const handleYearChange = (newYear) => {
    setSelectedYear(newYear);
    setRequestedDays(new Set());
    setPlanA(new Set());
    setPlanB(new Set());
    setPlanC(new Set());
    setExhaustedDays(new Set()); setHistory([]);
  };

  const dynamicMonths = useMemo(() => {
    const list = [];
    for (let m = 1; m <= 12; m++) {
      const daysInMonth = new Date(selectedYear, m, 0).getDate();
      let startD = new Date(selectedYear, m - 1, 1).getDay();
      startD = (startD === 0) ? 6 : startD - 1; // 0=Mon, ..., 6=Sun
      list.push({ id: m, name: MONTH_NAMES[m-1], days: daysInMonth, startDay: startD });
    }
    return list;
  }, [selectedYear]);

  const highDemandDays = useMemo(() => {
    const hd = new Set();
    const fixedHolidays = ['1-1', '1-6', '5-1', '5-2', '8-15', '10-12', '11-1', '11-9', '12-6', '12-8', '12-25'];
    
    const addDays = (date, days) => new Date(date.getTime() + days * 86400000);
    const formatDate = (date) => `${date.getMonth() + 1}-${date.getDate()}`;
    
    // Semana Santa
    const easter = getEasterSunday(selectedYear);
    const holyWeek = [4,3,2,1,0,-1].map(d => formatDate(addDays(easter, -d)));
    holyWeek.forEach(d => hd.add(d));

    // Puentes dinámicos
    fixedHolidays.forEach(hStr => {
      const [m, d] = hStr.split('-').map(Number);
      const date = new Date(selectedYear, m - 1, d);
      const dow = date.getDay(); // 0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu, 5=Fri, 6=Sat
      
      hd.add(hStr);
      
      if (dow === 2) { // Martes -> Lunes es puente y Viernes anterior
        hd.add(formatDate(addDays(date, -1)));
        hd.add(formatDate(addDays(date, -4)));
      } else if (dow === 4) { // Jueves -> Viernes es puente
        hd.add(formatDate(addDays(date, 1)));
      } else if (dow === 1) { // Lunes -> Viernes anterior
        hd.add(formatDate(addDays(date, -3)));
      } else if (dow === 3) { // Miércoles -> Jueves y Viernes
        hd.add(formatDate(addDays(date, 1)));
        hd.add(formatDate(addDays(date, 2)));
      }
    });

    // Semana del puente de Diciembre (6 y 8)
    const dec6 = new Date(selectedYear, 11, 6);
    let dec6Dow = dec6.getDay();
    dec6Dow = dec6Dow === 0 ? 7 : dec6Dow; 
    const startOfDecWeek = addDays(dec6, -(dec6Dow - 1)); // Lunes
    for (let i = -3; i <= 4; i++) {
      const current = addDays(startOfDecWeek, i);
      if (current.getDay() > 0 && current.getDay() < 6) { // Solo L-V
        hd.add(formatDate(current));
      }
    }

    // Navidades completas
    for (let i = 23; i <= 31; i++) {
      hd.add(`12-${i}`);
    }

    // Puente de Mayo (Si 1 o 2 caen en finde)
    const may1 = new Date(selectedYear, 4, 1);
    const may2 = new Date(selectedYear, 4, 2);
    if (may1.getDay() === 6) hd.add('4-30'); // Sábado -> Viernes 30
    if (may2.getDay() === 0) { hd.add('5-3'); hd.add('5-4'); } // Domingo -> Lunes 3 y Martes 4

    return hd;
  }, [selectedYear]);

  // ── Convivencia de Transmisión: V+S+D del último finde de octubre ──
  const convivenciaDays = useMemo(() => {
    const oct31 = new Date(selectedYear, 9, 31); // 31 de octubre
    const oct31dow = oct31.getDay(); // 0=Dom, 6=Sab
    // Encontrar el último domingo de octubre
    const daysToLastSun = oct31dow === 0 ? 0 : oct31dow; // retroceder hasta domenica
    const lastSun = new Date(oct31.getTime() - daysToLastSun * 86400000);
    const lastSat = new Date(lastSun.getTime() - 86400000);
    const lastFri = new Date(lastSun.getTime() - 2 * 86400000);
    const fmtC = d => `${d.getMonth()+1}-${d.getDate()}`;
    return new Set([fmtC(lastFri), fmtC(lastSat), fmtC(lastSun)]);
  }, [selectedYear]);

  // ── Añadir días de convivencia a pedidos ──
  const addConvivencia = () => {
    const days = Array.from(convivenciaDays);
    const available = days.filter(k => {
      const [ms, ds] = k.split('-').map(Number);
      const mObj = dynamicMonths.find(x => x.id === ms);
      if (!mObj) return false;
      const dow = (mObj.startDay + ds - 1) % 7;
      const isWE = dow >= 5;
      return !baseOffDays.has(k) && !vacationDays.has(k) && !exhaustedDays.has(k)
             && getRemainingQuota(ms, ds, isWE) > 0;
    });
    if (!available.length) { showError('Los días de Convivencia no tienen cupo o están bloqueados.'); return; }
    pushHistory();
    const n = new Set(requestedDays);
    available.forEach(k => n.add(k));
    setRequestedDays(n);
    notify(`✅ ${available.length} días de Convivencia de Transmisión añadidos.`, 'success');
  };

  const activeMaqPerSlot = useMemo(() => {
    if (!calcRateByDur) return maqPerSlot;
    const totalSlots = (shiftHours * 60) / appInterval;
    return totalSlots > 0 ? (maqPerTurn / totalSlots) : 1;
  }, [calcRateByDur, maqPerSlot, shiftHours, maqPerTurn, appInterval]);

  const maquinistasAhead = useMemo(() => {
    if (manualMaqAhead !== null) return manualMaqAhead;
    let base = (currentTurn - 1) * maqPerTurn;
    if (calcByApp) {
      const [h, m] = appTime.split(':').map(Number);
      const [sh, sm] = shiftStart.split(':').map(Number);
      const diffMin = (h * 60 + m) - (sh * 60 + sm);
      if (diffMin > 0) {
        base += Math.floor((diffMin / appInterval) * activeMaqPerSlot);
      }
    }
    return base;
  }, [currentTurn, maqPerTurn, manualMaqAhead, calcByApp, appTime, shiftStart, appInterval, activeMaqPerSlot]);

  const diasArrasados = Math.round(maquinistasAhead * 11.5);

  const groupCurrentYear = (groupLastYear % 5) + 1;

  const sumVac = useMemo(() => {
    if (groupCurrentYear === 1) return 'S1';
    if (groupCurrentYear === 2) return 'S2';
    if (groupCurrentYear === 3) return 'S3';
    if (groupCurrentYear === 4) return 'S4';
    return subGroup5;
  }, [groupCurrentYear, subGroup5]);

  const sumVacName = VACATIONS.summer.find(v => v.id === sumVac)?.name || '';

  useEffect(() => {
    const s = new Set();
    const addRange = vac => {
      if (!vac) return;
      for (let m = vac.m1; m <= vac.m2; m++) {
        const mDays = new Date(selectedYear, m, 0).getDate();
        const start = m === vac.m1 ? vac.d1 : 1;
        const end   = m === vac.m2 ? vac.d2 : mDays;
        for (let d = start; d <= end; d++) s.add(`${m}-${d}`);
      }
    };
    addRange(VACATIONS.summer.find(v => v.id === sumVac));
    addRange(VACATIONS.winter.find(v => v.id === winVac));
    setCustomVacationDays(s);
  }, [sumVac, winVac, selectedYear]);

  const vacationDays = customVacationDays;

  const baseOffDays = useMemo(() => {
    const s = new Set();
    const anchor = new Date(2027, 0, 1).getTime();
    const offset = (restGroup - 1) * 7;
    
    for (let m = 1; m <= 12; m++) {
      const daysInMonth = new Date(selectedYear, m, 0).getDate();
      for (let d = 1; d <= daysInMonth; d++) {
        const current = new Date(selectedYear, m - 1, d).getTime();
        const diffInDays = Math.round((current - anchor) / 86400000);
        const pi = (diffInDays - 3 + offset + 280000) % 28;
        if (PATTERN_28_DAYS[pi]) s.add(`${m}-${d}`);
      }
    }
    return s;
  }, [restGroup, selectedYear]);

  const stats = useMemo(() => {
    let workedDaysGross = 0, offDaysCount = 0, vacDaysCount = 0;
    dynamicMonths.forEach(mObj => {
      for (let day = 1; day <= mObj.days; day++) {
        const dateKey = `${mObj.id}-${day}`;
        if (baseOffDays.has(dateKey))             offDaysCount++;
        else if (vacationDays.has(dateKey))       vacDaysCount++;
        else workedDaysGross++;
      }
    });
    const grossCredit  = Math.max(0, workedDaysGross - 202);
    const creditNeto   = grossCredit;
    const obligatoryLV = Math.min(grossCredit, 7);
    const freeSD       = Math.max(0, grossCredit - 7);
    return { workedDays: workedDaysGross, offDaysCount, vacDaysCount,
             grossCredit, credit: creditNeto, obligatoryLV, freeSD };
  }, [baseOffDays, vacationDays, dynamicMonths]);

  const reqStats = useMemo(() => {
    let usedLV = 0, usedSD = 0;
    requestedDays.forEach(key => {
      const [mStr, dStr] = key.split('-');
      const mObj  = dynamicMonths.find(x => x.id === parseInt(mStr));
      if (!mObj) return;
      const dow   = (mObj.startDay + parseInt(dStr) - 1) % 7;
      if (dow >= 5) usedSD++; else usedLV++;
    });
    return { usedLV, usedSD, total: usedLV + usedSD };
  }, [requestedDays, dynamicMonths]);

  const DOW_NAMES = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  const HOLIDAY_NAMES = {'1-1':'Año Nuevo','1-6':'Reyes','5-1':'Trabajo','5-2':'C.Madrid',
    '8-15':'Asunción','10-12':'Hispanidad','11-1':'T.Santos','11-9':'Almudena',
    '12-6':'Constitución','12-8':'Inmaculada','12-25':'Navidad'};

  const monthReqCount = useMemo(() => {
    const s = {}; dynamicMonths.forEach(m => { s[m.id] = 0; });
    requestedDays.forEach(k => { const m = parseInt(k.split('-')[0]); if (s[m]!==undefined) s[m]++; });
    return s;
  }, [requestedDays, dynamicMonths]);

  const healthScore = useMemo(() => {
    if (!requestedDays.size) return null;
    let hi = 0;
    requestedDays.forEach(k => { if (highDemandDays.has(k)) hi++; });
    return Math.round((hi / requestedDays.size) * 100);
  }, [requestedDays, highDemandDays]);

  const sortDays = (setOfDays) => {
    return Array.from(setOfDays).map(key => {
      const [m, d] = key.split('-').map(Number);
      return { m, d, key };
    }).sort((a,b) => a.m !== b.m ? a.m - b.m : a.d - b.d);
  };

  const sortedRequestedDays = useMemo(() => sortDays(requestedDays), [requestedDays]);
  const sortedPlanA = useMemo(() => sortDays(planA), [planA]);
  const sortedPlanB = useMemo(() => sortDays(planB), [planB]);
  const sortedPlanC = useMemo(() => sortDays(planC), [planC]);

  const getRemainingQuota = (monthId, day, isWeekend) => {
    if (monthId === 1) return 0;
    const optKey = 'A';
    let initial;
    if (monthId === 6)
      initial = day <= 15
        ? (isWeekend ? QUOTAS_INITIAL[optKey][6].q1.SD : QUOTAS_INITIAL[optKey][6].q1.L)
        : (isWeekend ? QUOTAS_INITIAL[optKey][6].q2.SD : QUOTAS_INITIAL[optKey][6].q2.L);
    else
      initial = isWeekend ? QUOTAS_INITIAL[optKey][monthId].SD : QUOTAS_INITIAL[optKey][monthId].L;

    // Apply half-quota rule based on morning/afternoon split
    initial = shiftPhase === 'manana' ? Math.ceil(initial / 2) : Math.floor(initial / 2);

    const tp        = (currentTurn - 1) / Math.max(optPositions - 1, 1);
    const isSummer  = monthId===7 || monthId===8 || (monthId===6 && day>15);
    const isPuente  = highDemandDays.has(`${monthId}-${day}`) && !isWeekend;
    const isGood    = (monthId===5||monthId===9||monthId===12||(monthId===6&&day<=15)) && !isWeekend && !isPuente;

    let factor = 1;
    if (isPuente)   factor = 2.1;
    else if (isSummer)   factor = 1.9;
    else if (isWeekend)  factor = 1.7;
    else if (isGood)     factor = 1.1;
    else                 factor = 0.6;

    if (shiftPhase === 'tarde') {
      factor = factor * 0.70; // 30% less aggressive depletion in the afternoon since many have exhausted credit
    }

    return Math.round(initial * Math.max(0, 1 - tp * factor));
  };

  // ── planAQuota0 (needs getRemainingQuota — defined AFTER it) ──
  const planAQuota0 = (() => {
    let count = 0;
    planA.forEach(k => {
      const [ms, ds] = k.split('-').map(Number);
      const mObj = dynamicMonths.find(x => x.id===ms);
      if (!mObj) return;
      if (getRemainingQuota(ms, ds, (mObj.startDay+ds-1)%7 >= 5) === 0) count++;
    });
    return count;
  })();

  // ── Smart suggestion (Prioridades personalizadas) ──
  const suggestOptimalDays = () => {
    const creditNeeded = Math.floor(stats.credit);
    if (creditNeeded <= 0) { showError('No hay días de crédito disponibles.'); return; }

    // Fechas especiales calculadas
    const easter = getEasterSunday(selectedYear);
    const addDays = (date, days) => new Date(date.getTime() + days * 86400000);
    const fmtKey  = (date) => `${date.getMonth()+1}-${date.getDate()}`;

    const palmSunday      = fmtKey(addDays(easter, -7));   // Domingo de Ramos
    const easterSunday    = fmtKey(easter);                // Domingo de Pascua
    const pentecostSunday = fmtKey(addDays(easter, 49));   // Domingo de Pentecostés
    const specialSundays  = new Set([palmSunday, easterSunday, pentecostSunday]);

    // Festivos nacionales fijos
    const nationalHolidays = new Set(['1-1','1-6','5-1','5-2','8-15','10-12','11-1','11-9','12-6','12-8','12-25']);

    // Scorecard: número MENOR = mejor prioridad
    // ─────────────────────────────────────────────────────────────
    // PRIORIDAD 1:  Días entre semana jul/ago (sin vacaciones)
    // PRIORIDAD 2:  Fines de semana jul/ago  (sin vacaciones)
    // PRIORIDAD 3a: Días no lectivos entre semana de junio / finde de junio
    // PRIORIDAD 3b: Dom. Ramos, Dom. Pascua, Dom. Pentecostés
    // PRIORIDAD 4:  Días no lectivos / festivos del año (resto)
    // PRIORIDAD 5:  Fines de semana de todo el año (resto)
    // PRIORIDAD 6:  Entre semana de Oct / Nov / Dic (último recurso)
    // PRIORIDAD 99: Cualquier otro día (muy última opción)
    // ─────────────────────────────────────────────────────────────
    const scoreDay = (m, d, isWE) => {
      const k = `${m}-${d}`;
      const isVac = vacationDays.has(k);

      // ── Julio y Agosto (solo si no están en vacaciones) ──
      if ((m===7||m===8) && !isVac) {
        return isWE ? 20 : 10;   // P1 L-V = 10 | P2 S-D = 20
      }

      // ── Junio ──
      if (m===6 && !isVac) {
        const isNoLectivo = highDemandDays.has(k) || nationalHolidays.has(k);
        if (!isWE && isNoLectivo) return 30;  // P3a entre semana no lectivo junio
        if (isWE)                 return 40;  // P3a finde de junio
        if (!isWE)                return 45;  // Junio entre semana normal (algo peor)
      }

      // ── Domingos especiales (Ramos, Pascua, Pentecostés) ──
      if (specialSundays.has(k)) return 35;

      // ── Días no lectivos / festivos del año (resto de meses) ──
      if (nationalHolidays.has(k) || highDemandDays.has(k)) return 50;

      // ── Convivencia de Transmisión (V+S+D último finde octubre) ──
      if (convivenciaDays.has(k)) return 55;

      // ── Fines de semana del resto del año ──
      if (isWE) return 60;

      // ── Entre semana de Oct / Nov / Dic (último recurso L-V) ──
      if (m===10||m===11||m===12) return 70;

      // ── Cualquier otro día entre semana ──
      return 99;
    };
    // Unificar todos los días disponibles en una sola lista priorizada
    const allAvail = [];
    let availLVCount = 0, availSDCount = 0;
    dynamicMonths.forEach(mObj => {
      if (mObj.id===1) return;
      for (let d=1; d<=mObj.days; d++) {
        const key=`${mObj.id}-${d}`, dow=(mObj.startDay+d-1)%7, isWE=dow>=5;
        if (baseOffDays.has(key)||vacationDays.has(key)||exhaustedDays.has(key)) continue;
        if (getRemainingQuota(mObj.id,d,isWE)<=0) continue;
        const sc=scoreDay(mObj.id,d,isWE);
        allAvail.push({key,sc,isWE});
        if (isWE) availSDCount++; else availLVCount++;
      }
    });
    // Ordenar por prioridad global (menor score = mejor)
    allAvail.sort((a,b) => a.sc !== b.sc ? a.sc-b.sc : 0);

    pushHistory();
    const newDays=new Set();
    const lvNeeded = Math.min(Math.floor(stats.obligatoryLV), availLVCount);
    let lvChosen=0;

    // Primera pasada: cubrir mínimo L-V obligatorio con los mejores L-V disponibles
    const lvCandidates = allAvail.filter(x=>!x.isWE);
    lvCandidates.slice(0, lvNeeded).forEach(x => { newDays.add(x.key); lvChosen++; });

    // Segunda pasada: completar el crédito total con los mejores días aún no elegidos
    for (const {key} of allAvail) {
      if (newDays.size >= creditNeeded) break;
      if (!newDays.has(key)) newDays.add(key);
    }

    setRequestedDays(newDays);
    showError(`Sugeridos ${newDays.size} días óptimos (${lvChosen} L-V obligatorios). Ajusta a tu gusto.`);
  };

  // ── Export ICS ──
  const exportICS = () => {
    const [hh,mm] = appTime.split(':').map(Number);
    const pad = n => String(n).padStart(2,'0');
    const fmt = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
    const s = new Date(selectedYear,0,appDay,hh,mm), e2 = new Date(selectedYear,0,appDay,hh,mm+10);
    const ics=[
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//PlanCredito//ES',
      'BEGIN:VEVENT',`DTSTART:${fmt(s)}`,`DTEND:${fmt(e2)}`,
      `SUMMARY:CITA CREDITO ${selectedYear} - Turno ${currentTurn}`,
      `DESCRIPTION:Turno ${currentTurn}/${optPositions}. Credito: ${stats.credit} dias.`,
      'BEGIN:VALARM','TRIGGER:-PT5M','ACTION:DISPLAY','DESCRIPTION:Cita en 5 min','END:VALARM',
      'END:VEVENT','END:VCALENDAR'
    ].join('\n');
    const a=Object.assign(document.createElement('a'),{
      href:URL.createObjectURL(new Blob([ics],{type:'text/calendar'})),
      download:`cita_${selectedYear}.ics`});
    a.click();
  };

  // ── Export CSV ──
  const exportCSV = () => {
    const rows=['Dia,Mes,Tipo'];
    sortedRequestedDays.forEach(({m,d}) => {
      const mObj=dynamicMonths.find(x=>x.id===m);
      const dow=(mObj.startDay+d-1)%7;
      rows.push(`${String(d).padStart(2,'0')},${mObj.name},${dow>=5?'S-D':'L-V'}`);
    });
    if (rows.length===1) { showError('No hay días pedidos para exportar.'); return; }
    const a=Object.assign(document.createElement('a'),{
      href:'data:text/csv;charset=utf-8,'+encodeURIComponent(rows.join('\n')),
      download:`credito_${selectedYear}.csv`});
    a.click();
  };

  // ── Share URL ──
  const shareURL = () => {
    const state = {
      yr: selectedYear, t: turn, rg: restGroup, gly: groupLastYear, sg5: subGroup5,
      wv: winVac, sp: shiftPhase, ad: appDay, at: appTime,
      mpt: maqPerTurn, mma: manualMaqAhead,
      cba: calcByApp, api: appInterval, ss: shiftStart,
      mps: maqPerSlot, sh: shiftHours, cbd: calcRateByDur,
      req: [...requestedDays], pa: [...planA], pb: [...planB], pc: [...planC],
      ex: [...exhaustedDays], nt: notes
    };
    
    try {
      const jsonStr = JSON.stringify(state);
      const b64 = btoa(unescape(encodeURIComponent(jsonStr)));
      
      const isLocal = window.location.protocol === 'file:';
      const isProxy = window.location.host.includes('provider') || window.location.host === '';
      
      if (isLocal || isProxy) {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(b64)
            .then(() => notify('¡CÓDIGO Copiado! Pégalo en el botón IMPORTAR de otro dispositivo.', 'success'))
            .catch(() => fallbackCopyTextToClipboard(b64));
        } else {
          fallbackCopyTextToClipboard(b64);
        }
      } else {
        const url = `${window.location.protocol}//${window.location.host}${window.location.pathname}?p=${b64}`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url)
            .then(() => notify('Enlace de comparación copiado al portapapeles.', 'success'))
            .catch(() => fallbackCopyTextToClipboard(url));
        } else {
          fallbackCopyTextToClipboard(url);
        }
      }
    } catch (e) {
      showError('Error al generar el enlace de compartir.');
    }
  };

  // ── Copy to clipboard ──
  const copyDaysToClipboard = () => {
    if (!sortedRequestedDays.length) { showError('No hay días pedidos.'); return; }
    const txt = sortedRequestedDays.map(({m,d}) => {
      const mObj=dynamicMonths.find(x=>x.id===m);
      const dow=(mObj.startDay+d-1)%7;
      return `${String(d).padStart(2,'0')} ${mObj.name} (${dow>=5?'S-D':'L-V'})`;
    }).join('\n');
    
    const textToCopy = `Días crédito ${selectedYear}:\n${txt}`;

    // Modern API
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textToCopy)
        .then(() => notify('Días copiados al portapapeles', 'success'))
        .catch(() => fallbackCopyTextToClipboard(textToCopy));
    } else {
      fallbackCopyTextToClipboard(textToCopy);
    }
  };

  const fallbackCopyTextToClipboard = (text) => {
    try {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed"; // Avoid scrolling to bottom
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      const successful = document.execCommand('copy');
      document.body.removeChild(textArea);
      if (successful) notify('Días copiados (fallback)', 'success');
      else notify('Error al copiar automáticamente', 'error');
    } catch (err) {
      notify('Error al copiar', 'error');
    }
  };


  const toggleExhausted = (dateKey) => {
    pushHistory();
    const n = new Set(exhaustedDays);
    if (n.has(dateKey)) {
      n.delete(dateKey);
    } else {
      n.add(dateKey);
      if (requestedDays.has(dateKey)) { const req = new Set(requestedDays); req.delete(dateKey); setRequestedDays(req); }
      if (planA.has(dateKey)) { const a = new Set(planA); a.delete(dateKey); setPlanA(a); }
      if (planB.has(dateKey)) { const b = new Set(planB); b.delete(dateKey); setPlanB(b); }
      if (planC.has(dateKey)) { const c = new Set(planC); c.delete(dateKey); setPlanC(c); }
    }
    setExhaustedDays(n);
  };

  const setPlanDay = (dateKey, planType) => {
    pushHistory();
    if (planA.has(dateKey)) { const a = new Set(planA); a.delete(dateKey); setPlanA(a); }
    if (planB.has(dateKey)) { const b = new Set(planB); b.delete(dateKey); setPlanB(b); }
    if (planC.has(dateKey)) { const c = new Set(planC); c.delete(dateKey); setPlanC(c); }
    
    // Si estaba en el mismo plan, ya lo hemos borrado actuando como Toggle. Si estaba en otro, lo añadimos al nuevo.
    let isTogglingOff = false;
    if (planType === 'plan_a' && planA.has(dateKey)) isTogglingOff = true;
    if (planType === 'plan_b' && planB.has(dateKey)) isTogglingOff = true;
    if (planType === 'plan_c' && planC.has(dateKey)) isTogglingOff = true;

    if (!isTogglingOff) {
      if (planType === 'plan_a') { const a = new Set(planA); a.delete(dateKey); a.add(dateKey); setPlanA(a); }
      if (planType === 'plan_b') { const b = new Set(planB); b.delete(dateKey); b.add(dateKey); setPlanB(b); }
      if (planType === 'plan_c') { const c = new Set(planC); c.delete(dateKey); c.add(dateKey); setPlanC(c); }
    }
  };

  const handleDayClick = (monthId, day, isWeekend, e) => {
    const dateKey = `${monthId}-${day}`;
    if (e && e.shiftKey && lastClickKey && clickMode === 'pedir') {
      const [lm, ld] = lastClickKey.split('-').map(Number);
      const allDays = [];
      dynamicMonths.forEach(mObj => { for (let d=1;d<=mObj.days;d++) allDays.push({m:mObj.id,d,mObj}); });
      const iA = allDays.findIndex(x=>x.m===lm&&x.d===ld);
      const iB = allDays.findIndex(x=>x.m===monthId&&x.d===day);
      if (iA !== -1 && iB !== -1) {
        const [fr,to] = iA<iB?[iA,iB]:[iB,iA];
        pushHistory();
        const n = new Set(requestedDays);
        allDays.slice(fr,to+1).forEach(({m,d,mObj}) => {
          const k=`${m}-${d}`; const dow=(mObj.startDay+d-1)%7;
          if (m===1||baseOffDays.has(k)||vacationDays.has(k)||exhaustedDays.has(k)) return;
          if (getRemainingQuota(m,d,dow>=5)>0 && n.size<Math.floor(stats.credit)) n.add(k);
        });
        setRequestedDays(n);
      }
      return;
    }
    setLastClickKey(dateKey);
    
    if (clickMode === 'vacaciones') {
      if (baseOffDays.has(dateKey)) {
        showError('No puedes marcar vacaciones en un día de descanso por patrón (LIB).');
        return;
      }
      const n = new Set(customVacationDays);
      if (n.has(dateKey)) n.delete(dateKey); else n.add(dateKey);
      setCustomVacationDays(n);
      return;
    }

    if (monthId === 1) { showError('Enero está bloqueado para nuevas peticiones.'); return; }
    if (baseOffDays.has(dateKey)||vacationDays.has(dateKey)) return;

    if (clickMode === 'agotar') {
      toggleExhausted(dateKey);
      return;
    }

    if (exhaustedDays.has(dateKey)) {
      showError('Día agotado. (Usa el modo "❌ Agotar" o Click Derecho para desmarcarlo)');
      return;
    }

    if (clickMode.startsWith('plan_')) {
      setPlanDay(dateKey, clickMode);
      return;
    }

    // clickMode === 'pedir'
    if (requestedDays.has(dateKey)) {
      const n = new Set(requestedDays); n.delete(dateKey);
      setRequestedDays(n); setErrorMsg(''); return;
    }

    const quota = getRemainingQuota(monthId, day, isWeekend);
    if (quota <= 0) { showError(`Cupo agotado en el turno ${currentTurn}.`); return; }
    if (isWeekend && reqStats.usedLV < Math.floor(stats.obligatoryLV))
      { showError(`Primero debes pedir ${Math.floor(stats.obligatoryLV)} días L-V.`); return; }
    if (reqStats.total >= Math.floor(stats.credit)) 
      { showError(`Crédito completo (${Math.floor(stats.credit)} días) ya usado.`); return; }

    pushHistory();
    const n = new Set(requestedDays); n.add(dateKey);
    setRequestedDays(n); 
    
    if (planA.has(dateKey)) { const a = new Set(planA); a.delete(dateKey); setPlanA(a); }
    if (planB.has(dateKey)) { const b = new Set(planB); b.delete(dateKey); setPlanB(b); }
    if (planC.has(dateKey)) { const c = new Set(planC); c.delete(dateKey); setPlanC(c); }
    
    setErrorMsg('');
  };

  const handleRightClick = (e, monthId, day) => {
    e.preventDefault();
    const dateKey = `${monthId}-${day}`;
    if (monthId === 1) return;
    if (baseOffDays.has(dateKey)||vacationDays.has(dateKey)) return;
    if (e.shiftKey) { toggleExhausted(dateKey); return; }
    setNoteModal({dateKey, text: notes[dateKey] || ''});
  };

  const notify = (msg, type = 'error') => {
    setErrorMsg(msg);
    setMsgType(type);
    setTimeout(() => setErrorMsg(''), 5000);
  };
  const showError = msg => notify(msg, 'error'); // Backwards compatibility

  const renderMonthCalendar = monthData => {
    const cells = [];
    for (let i = 0; i < monthData.startDay; i++)
      cells.push(<div key={`e-${i}`} className="bg-slate-50 opacity-40 border-r border-b" />);

    for (let day = 1; day <= monthData.days; day++) {
      const dow       = (monthData.startDay + day - 1) % 7;
      const isWeekend = dow >= 5;
      const dateKey   = `${monthData.id}-${day}`;
      const quota     = getRemainingQuota(monthData.id, day, isWeekend);
      const isOff     = baseOffDays.has(dateKey);
      const isVac     = vacationDays.has(dateKey);
      const isReq     = requestedDays.has(dateKey);
      const isExhausted = exhaustedDays.has(dateKey);
      const isConvivencia = convivenciaDays.has(dateKey);
      
      const isPA = planA.has(dateKey), isPB = planB.has(dateKey), isPC = planC.has(dateKey);
      const todayR = new Date();
      const isToday = selectedYear===todayR.getFullYear() && monthData.id===todayR.getMonth()+1 && day===todayR.getDate();
      const hasNote = notes && !!notes[dateKey];
      const isPlan = isPA || isPB || isPC;
      const isPuente  = highDemandDays.has(dateKey) && !isWeekend;

      let cls = 'relative border-r border-b flex flex-col h-14 md:h-16 p-0.5 md:p-1 transition-all duration-150 ';
      if      (isVac)  cls += 'bg-yellow-300 text-yellow-800 shadow-inner opacity-60';
      else if (isOff)  cls += 'bg-slate-800 text-white shadow-inner opacity-60';
      else if (isExhausted) cls += 'bg-red-200 text-red-900 border-red-400 opacity-60 cursor-not-allowed';
      else if (isReq)  cls += 'bg-green-500 text-white ring-2 ring-green-600 shadow-md cursor-pointer scale-100 z-10';
      else if (isPA)   cls += 'bg-yellow-50 text-yellow-900 border-2 border-dashed border-yellow-500 shadow-sm cursor-pointer hover:bg-yellow-100';
      else if (isPB)   cls += 'bg-orange-50 text-orange-900 border-2 border-dashed border-orange-500 shadow-sm cursor-pointer hover:bg-orange-100';
      else if (isPC)   cls += 'bg-slate-50 text-slate-700 border-2 border-dashed border-slate-500 shadow-sm cursor-pointer hover:bg-slate-100';
      else if (quota===0 && monthData.id!==1) cls += 'bg-red-50 text-red-400 cursor-not-allowed opacity-70';
      else if (isToday)  cls += 'bg-blue-100 ring-2 ring-inset ring-blue-500 cursor-pointer';
      else if (isPuente) cls += 'bg-orange-50 hover:bg-orange-100 cursor-pointer border-orange-200';
      else               cls += 'bg-white hover:bg-blue-50 cursor-pointer';

      cells.push(
        <div key={day}
             onClick={(e) => handleDayClick(monthData.id, day, isWeekend, e)}
             onContextMenu={(e) => handleRightClick(e, monthData.id, day)}
             onMouseEnter={(e) => setTooltip({x:e.clientX, y:e.clientY, day,
               monthName:monthData.name, dow:DOW_NAMES[(monthData.startDay+day-1)%7],
               quota:isOff||isVac?null:quota, isOff, isVac, isReq, isPuente,
               isConvivencia, holiday:HOLIDAY_NAMES[dateKey]||null,
               planType:isPA?'A':isPB?'B':isPC?'C':null,
               note:hasNote?notes[dateKey]:null})}
             onMouseLeave={()=>setTooltip(null)}
             className={cls + (isConvivencia && !isReq && !isOff && !isVac ? ' ring-2 ring-inset ring-purple-400' : '')}>
          {isExhausted && (
             <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
               <XCircle size={28} strokeWidth={1.5} className="text-red-600 opacity-30 md:opacity-40" />
             </div>
          )}
          {isPuente && !isVac && !isOff && !isExhausted && (
            <div className="absolute top-0 right-0 p-0.5">
              <Flame size={10} className="text-orange-500 opacity-60 md:opacity-80" />
            </div>
          )}
          <div className="flex justify-between items-start leading-none relative z-10">
            <span className={`font-black text-xs md:text-sm ${
              !isOff&&!isVac&&!isReq&&!isExhausted&&!isPlan
                ? isWeekend?'text-red-500':isPuente?'text-orange-700':'text-slate-700'
                : ''}`}>
              {day}
            </span>
            {isToday && !isVac && !isOff && <span className="text-[7px] font-black text-blue-700 bg-blue-200 px-0.5 rounded hidden sm:inline">HOY</span>}
            {hasNote && <span className="absolute bottom-0.5 left-0.5 w-1.5 h-1.5 bg-purple-500 rounded-full z-20"/>}
            {isVac  && <span className="text-[7px] md:text-[8px] font-black text-yellow-800 hidden sm:inline">VAC</span>}
            {isOff  && !isVac && <span className="text-[7px] md:text-[8px] text-slate-400 hidden sm:inline">LIB</span>}
            {isReq  && <span className="text-[7px] md:text-[8px] bg-white text-green-700 font-black px-0.5 rounded hidden sm:inline">PED</span>}
            {isConvivencia && !isReq && !isOff && !isVac && <span className="text-[7px] md:text-[8px] bg-purple-500 text-white font-black px-0.5 rounded hidden sm:inline">CONV</span>}
            {isPA && <span className="text-[7px] md:text-[8px] bg-yellow-400 text-yellow-900 font-black px-0.5 rounded hidden sm:inline">PLA</span>}
            {isPB && <span className="text-[7px] md:text-[8px] bg-orange-400 text-orange-900 font-black px-0.5 rounded hidden sm:inline">PLB</span>}
            {isPC && <span className="text-[7px] md:text-[8px] bg-slate-400 text-white font-black px-0.5 rounded hidden sm:inline">PLC</span>}
          </div>
          {!isOff&&!isVac&&!isReq&&!isExhausted&&monthData.id!==1 && (
            <div className={`mt-auto text-center font-bold rounded-sm text-[8px] md:text-[9px] p-0.5 relative z-10 truncate ${
              quota===0
                ?'bg-red-100 text-red-700 border border-red-200'
                :isPlan 
                  ?(isPA?'bg-yellow-200 text-yellow-800 border-yellow-300':(isPB?'bg-orange-200 text-orange-900 border-orange-300':'bg-slate-200 text-slate-800 border-slate-300'))
                  :isPuente
                    ?'bg-orange-100 text-orange-800 border border-orange-200'
                    :'bg-slate-100 text-slate-600 border border-slate-200'}`}>
              {quota}
            </div>
          )}
        </div>
      );
    }

    return (
      <div key={monthData.id}
           className={`bg-white border border-slate-300 rounded-xl overflow-hidden shadow-sm flex flex-col ${monthData.id===1?'opacity-70 grayscale-[0.3]':''}`}>
        <div className={`text-white font-black text-center uppercase tracking-widest py-1 text-[10px] md:text-xs flex items-center justify-center gap-1 ${monthData.id===1?'bg-slate-500':'bg-slate-800'}`}>
          {monthData.name} <span className="opacity-70 font-medium ml-1">{selectedYear}</span>
          {monthReqCount[monthData.id]>0 && <span className="ml-1 bg-green-500 text-white text-[9px] font-black px-1.5 rounded-full">{monthReqCount[monthData.id]}</span>}
        </div>
        <div className="grid grid-cols-7 bg-slate-100 text-slate-500 border-b border-slate-300">
          {WEEK_DAYS.map((d,i) => (
            <div key={d} className={`text-center font-bold uppercase border-r border-slate-200 py-1 text-[9px] md:text-[10px] ${i>=5?'text-red-400':''}`}>{d}</div>
          ))}
        </div>
        <div className="grid grid-cols-7 flex-1 bg-slate-200 gap-px">{cells}</div>
      </div>
    );
  };

  const handleClearAll = () => {
    if (!window.confirm('¿Borrar todos los días marcados? No se puede deshacer.')) return;
    setRequestedDays(new Set()); setPlanA(new Set()); setPlanB(new Set());
    setPlanC(new Set()); setExhaustedDays(new Set()); setHistory([]);
  };

  const renderWishlist = (title, arr, isPA=false, isPB=false, isPC=false) => {
    if (arr.length === 0) return null;
    return (
      <div className="mb-3">
        <h4 className={`font-bold text-[9px] md:text-[10px] uppercase mb-1.5 flex items-center gap-1 ${isPA?'text-yellow-700':isPB?'text-orange-700':'text-slate-600'}`}>
           <Star size={10} /> {title}
        </h4>
        <ul className={`text-[10px] md:text-xs font-black flex flex-col gap-1 ${isPA?'text-yellow-900':isPB?'text-orange-900':'text-slate-700'}`}>
          {arr.map(({m, d, key}, idx) => {
            const monthObj = dynamicMonths.find(x => x.id === m);
            const dow = (monthObj.startDay + d - 1) % 7;
            const isLV = dow < 5;
            return (
              <li key={key} className={`flex justify-between items-center bg-white px-2 md:px-2.5 py-1 md:py-1.5 rounded-lg border shadow-sm ${isPA?'border-yellow-300':isPB?'border-orange-300':'border-slate-300'}`}>
                <span className="tracking-wide opacity-90">{idx+1}. {String(d).padStart(2,'0')} {monthObj.name.substring(0,3).toUpperCase()}</span>
                <div className="flex gap-2 items-center">
                  <span className={`text-[8px] md:text-[10px] px-1 md:px-1.5 py-0.5 rounded uppercase ${isLV ? 'bg-slate-100 text-slate-500' : 'bg-slate-100 text-slate-500'}`}>{isLV ? 'L-V' : 'S-D'}</span>
                </div>
              </li>
            );
          })}
        </ul>
      </div>
    );
  };

  return (
    <div data-theme={darkMode?"dark":undefined} className="min-h-screen bg-slate-100 p-1 sm:p-2 md:p-4 font-sans text-slate-800 pb-24 md:pb-6">
      {tooltip && (
        <div className="fixed z-[9999] pointer-events-none" style={{left:tooltip.x+14,top:tooltip.y-12}}>
          <div className="bg-slate-900 text-white text-[11px] rounded-xl shadow-2xl p-3 min-w-[160px] border border-slate-700">
            <div className="font-black text-xs mb-1">{tooltip.dow} {tooltip.day} {tooltip.monthName}</div>
            {tooltip.holiday && <div className="text-yellow-400 font-bold mb-0.5">🎉 {tooltip.holiday}</div>}
            {tooltip.isOff && <div className="text-slate-400">🔵 Día LIB</div>}
            {tooltip.isVac && <div className="text-yellow-300">🏖️ Vacaciones</div>}
            {tooltip.isReq && <div className="text-green-400 font-black">✅ PEDIDO</div>}
            {tooltip.isConvivencia && <div className="text-purple-300 font-black">🤝 Convivencia Transmisión</div>}
            {tooltip.planType && <div className="text-orange-300">📌 Plan {tooltip.planType}</div>}
            {tooltip.isPuente && <div className="text-orange-400">🔥 Alta demanda</div>}
            {tooltip.note && <div className="text-purple-300 italic mt-0.5">📝 {tooltip.note}</div>}
            {tooltip.quota !== null && (
              <div className={`mt-1 font-bold ${tooltip.quota===0?'text-red-400':'text-blue-300'}`}>
                Cupo T{currentTurn}: {tooltip.quota===0?'AGOTADO':tooltip.quota}
              </div>
            )}
          </div>
        </div>
      )}
      {noteModal && (
        <div className="fixed inset-0 z-[9998] flex items-center justify-center" style={{background:'rgba(0,0,0,0.5)'}} onClick={()=>setNoteModal(null)}>
          <div className="bg-white rounded-2xl shadow-2xl p-5 w-80 border border-slate-200" onClick={e=>e.stopPropagation()}>
            <h3 className="font-black text-slate-800 text-sm mb-3 flex items-center gap-2">
              <MessageSquare size={16} className="text-purple-600"/> Nota — {noteModal.dateKey.replace('-',' / ')}
            </h3>
            <textarea autoFocus className="w-full border border-slate-300 rounded-lg p-2 text-sm resize-none h-20 outline-none"
              value={noteModal.text} onChange={e=>setNoteModal({...noteModal,text:e.target.value})}
              placeholder="Ej: cumpleaños, viaje..."/>
            <div className="flex gap-2 mt-3">
              <button className="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 rounded-lg text-sm"
                onClick={()=>{const n={...notes};if(noteModal.text.trim())n[noteModal.dateKey]=noteModal.text.trim();else delete n[noteModal.dateKey];setNotes(n);setNoteModal(null);}}>
                Guardar</button>
              <button className="flex-1 bg-slate-200 text-slate-700 font-bold py-2 rounded-lg text-sm"
                onClick={()=>setNoteModal(null)}>Cancelar</button>
              {notes[noteModal.dateKey] && (
                <button className="bg-red-100 text-red-700 font-bold py-2 px-3 rounded-lg text-sm"
                  onClick={()=>{const n={...notes};delete n[noteModal.dateKey];setNotes(n);setNoteModal(null);}}>🗑</button>
              )}
            </div>
          </div>
        </div>
      )}
      <div className="max-w-[1500px] mx-auto bg-white rounded-xl md:rounded-2xl shadow-xl overflow-hidden border border-slate-200 flex flex-col relative">

        {isPreAccess && (
          <div className="bg-yellow-500 text-yellow-900 font-black p-3 md:p-4 text-center z-50 animate-pulse shadow-md text-xs md:text-sm border-b-4 border-yellow-700 flex justify-center items-center gap-2">
             <Bell className="animate-bounce w-4 h-4 md:w-5 md:h-5" /> ALERTA: ACCESO PREVIO EN {formatMs(msToCita)}. PREPÁRATE PARA ENTRAR AL SISTEMA.
          </div>
        )}
        {isActiveTurn && (
          <div className="bg-red-600 text-white font-black p-3 md:p-4 text-center z-50 shadow-md text-sm md:text-lg border-b-4 border-red-800 flex justify-center items-center gap-2 md:gap-3">
             <Clock size={24} className="animate-pulse flex-shrink-0" /> <span className="animate-pulse">¡TURNO ACTIVO PIDE AHORA!</span> <span>CIERRE EN {formatMs(msToCita + 600000)}</span>
          </div>
        )}

        <div className="bg-slate-900 p-3 md:p-6 text-white flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 border-b-4 border-blue-500">
          <div className="flex gap-4 items-center w-full sm:w-auto">
            <h1 className="text-xl md:text-2xl font-black flex items-center gap-2 flex-grow">
              <Calculator className="text-blue-400 w-5 h-5 md:w-6 md:h-6" /> Planificador
            </h1>
            <div className="flex items-center gap-2 bg-slate-800 px-3 py-1 rounded-lg border border-slate-700">
              <CalendarDays size={18} className="text-slate-400"/>
              <select value={selectedYear} onChange={e=>handleYearChange(parseInt(e.target.value))} className="bg-transparent font-black text-blue-400 outline-none cursor-pointer">
                {[2026,2027,2028,2029,2030,2031].map(y => <option key={y} value={y} className="text-black">{y}</option>)}
              </select>
            </div>
          </div>
          <div className="flex flex-wrap gap-1.5 no-print">
            <button onClick={undo} title="Deshacer (Ctrl+Z)"
              className="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1.5 border border-slate-600 text-xs">
              <Undo2 size={13}/> Deshacer
            </button>
            <button onClick={suggestOptimalDays}
              className="bg-blue-700 hover:bg-blue-600 text-white px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1.5 border border-blue-600 text-xs">
              <Zap size={13}/> Sugerir Óptimo
            </button>
            <button onClick={addConvivencia} title="Añadir V+S+D del último finde de octubre (Convivencia de Transmisión)"
              className="bg-purple-700 hover:bg-purple-600 text-white px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1.5 border border-purple-600 text-xs">
              🤝 Convivencia
            </button>
            <button onClick={() => window.print()}
              className="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1.5 border border-slate-600 text-xs">
              <Printer size={13}/> PDF
            </button>
            <button onClick={exportCSV}
              className="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1.5 border border-slate-600 text-xs">
              <FileText size={13}/> CSV
            </button>
            <button onClick={importConfig}
              className="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1.5 border border-slate-600 text-xs">
              <FileUp size={13}/> Importar
            </button>
            <button onClick={shareURL}
              className="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1.5 border border-slate-600 text-xs">
              <Share2 size={13}/> Compartir
            </button>
            <button onClick={() => setDarkMode(d=>!d)} title="Modo oscuro"
              className="bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1.5 border border-slate-600 text-xs">
              {darkMode ? <Sun size={13}/> : <Moon size={13}/>}
            </button>
            <button onClick={handleClearAll}
              className="bg-red-800 hover:bg-red-700 px-2.5 py-1.5 rounded-lg font-bold flex items-center gap-1.5 border border-red-700 text-xs">
              <RefreshCw size={13}/> Reset
            </button>
          </div>
        </div>

        <div className="flex flex-col xl:flex-row flex-1">

          <div className="xl:w-96 bg-slate-50 border-r border-slate-200 p-2 md:p-6 flex flex-col gap-3 md:gap-5 overflow-y-auto xl:max-h-[calc(100vh-100px)]">

            <button onClick={() => setShowConfig(!showConfig)} 
                    className="xl:hidden bg-slate-800 text-white p-3 rounded-xl font-bold flex justify-between items-center shadow-md active:scale-[0.98] transition-all">
              <span className="flex items-center gap-2"><Settings size={16}/> Variables {selectedYear}</span>
              {showConfig ? <ChevronUp size={20}/> : <ChevronDown size={20}/>}
            </button>

            <div className={`${showConfig ? 'flex' : 'hidden'} xl:flex flex-col gap-3 md:gap-5`}>
              <div className="bg-white p-3 md:p-4 rounded-xl border border-slate-200 shadow-sm">
                <div className="flex items-center justify-between mb-2">
                  <h3 className="font-black text-slate-800 uppercase text-xs flex items-center gap-2">
                    <Settings size={14}/> 1. Turno de Petición
                  </h3>
                  <div className="flex bg-slate-100 rounded-lg p-0.5 border border-slate-200 shadow-inner">
                    <button onClick={() => setShiftPhase('manana')} className={`px-2 py-0.5 rounded text-[10px] md:text-xs font-bold transition-all ${shiftPhase === 'manana' ? 'bg-white shadow text-blue-700' : 'text-slate-500 hover:text-slate-700'}`}>Mañana</button>
                    <button onClick={() => setShiftPhase('tarde')} className={`px-2 py-0.5 rounded text-[10px] md:text-xs font-bold transition-all ${shiftPhase === 'tarde' ? 'bg-slate-700 shadow text-white' : 'text-slate-500 hover:text-slate-700'}`}>Tarde</button>
                  </div>
                </div>
                
                <input type="range" min="1" max={optPositions} value={currentTurn}
                       onChange={e=>setTurn(parseInt(e.target.value))} className="w-full accent-blue-600 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer" />
                <p className="text-center font-bold text-sm mt-2 text-blue-700">
                  {shiftPhase === 'manana' ? '🌅' : '🌇'} Turno {currentTurn} de {optPositions}
                </p>
              </div>

              <div className="bg-red-50 p-3 md:p-4 rounded-xl border-2 border-red-200 shadow-sm transition-all space-y-3">
                <h4 className="text-[10px] md:text-xs font-black text-red-800 uppercase flex items-center justify-between mb-1">
                  <span className="flex items-center gap-1"><Users size={14}/> Tsunami ({maqPerTurn}/turno)</span>
                  <button onClick={() => { setMaqPerTurn(160); setManualMaqAhead(null); setCalcByApp(false); }} className="text-[9px] bg-red-100 hover:bg-red-200 px-1.5 py-0.5 rounded text-red-700 active:scale-95 transition-all">Auto</button>
                </h4>

                <div className="grid grid-cols-2 gap-2">
                  <div className="bg-white p-1.5 rounded-lg border border-red-100 shadow-inner">
                    <span className="text-[8px] block font-bold text-red-400 uppercase leading-none mb-1">Maq/Turno</span>
                    <input type="number" value={maqPerTurn} onChange={e => setMaqPerTurn(parseInt(e.target.value)||0)}
                           className="w-full bg-transparent text-left font-black text-red-900 outline-none text-xs" />
                  </div>
                  <div className="bg-white p-1.5 rounded-lg border border-red-100 shadow-inner">
                    <span className="text-[8px] block font-bold text-red-400 uppercase leading-none mb-1">Gente Delante</span>
                    <div className="flex items-center gap-1">
                      {manualMaqAhead !== null && <button onClick={() => setManualMaqAhead(null)} className="text-[10px] text-red-400">🔄</button>}
                      <input type="number" placeholder={((currentTurn-1)*maqPerTurn).toString()} 
                             value={manualMaqAhead === null ? '' : manualMaqAhead} 
                             onChange={e => setManualMaqAhead(e.target.value === '' ? null : parseInt(e.target.value)||0)}
                             className="w-full bg-transparent text-left font-black text-red-900 outline-none text-xs placeholder:text-red-300" />
                    </div>
                  </div>
                </div>

                <div className="bg-red-100/50 p-2 rounded-lg border border-red-200/50">
                  <label className="flex items-center gap-2 cursor-pointer mb-2">
                    <input type="checkbox" checked={calcByApp} onChange={e => setCalcByApp(e.target.checked)} className="w-3 h-3 accent-red-600" />
                    <span className="text-[9px] font-black text-red-800 uppercase">Cálculo por cita (Sub-Turno)</span>
                  </label>
                  
                  {calcByApp && (
                    <div className="grid grid-cols-2 gap-2 mt-1 animate-in slide-in-from-top-1 duration-200">
                      <div className="bg-white/80 p-1 rounded border border-red-200">
                        <span className="text-[7px] block font-bold text-red-400 uppercase leading-none mb-0.5">Inicio Turno</span>
                        <input type="time" value={shiftStart} onChange={e => setShiftStart(e.target.value)}
                               className="w-full bg-transparent font-bold text-red-900 outline-none text-[10px]" />
                      </div>
                      <div className="bg-white/80 p-1 rounded border border-red-200">
                        <span className="text-[7px] block font-bold text-red-400 uppercase leading-none mb-0.5">Intervalo (min)</span>
                        <input type="number" value={appInterval} onChange={e => setAppInterval(parseInt(e.target.value)||1)}
                               className="w-full bg-transparent font-bold text-red-900 outline-none text-[10px]" />
                      </div>
                      <div className="bg-white/80 p-1 rounded border border-red-200">
                        <span className="text-[7px] block font-bold text-red-400 uppercase leading-none mb-0.5">Duración (h)</span>
                        <input type="number" value={shiftHours} onChange={e => setShiftHours(parseFloat(e.target.value)||1)}
                               className="w-full bg-transparent font-bold text-red-900 outline-none text-[10px]" />
                      </div>
                      <div className="bg-white/80 p-1 rounded border border-red-200">
                        <span className="text-[7px] block font-bold text-red-400 uppercase leading-none mb-0.5">Tasa (Auto: {activeMaqPerSlot.toFixed(2)})</span>
                        <div className="flex items-center gap-1">
                          <input type="checkbox" checked={calcRateByDur} onChange={e => setCalcRateByDur(e.target.checked)} className="w-2.5 h-2.5" />
                          <input type="number" step="0.01" value={maqPerSlot} disabled={calcRateByDur} 
                                 onChange={e => setMaqPerSlot(parseFloat(e.target.value)||1)}
                                 className={`w-full bg-transparent font-bold text-red-900 outline-none text-[10px] ${calcRateByDur ? 'opacity-30' : ''}`} />
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                <div className="pt-2 border-t border-red-100 flex justify-between items-center">
                  <span className="text-[10px] font-bold text-red-700 uppercase">Total Delante</span>
                  <span className="text-sm font-black text-red-900">{maquinistasAhead}</span>
                </div>
                <div className="flex justify-between items-center">
                  <span className="text-[10px] font-bold text-red-700 uppercase">Días Arrasados</span>
                  <span className="text-sm font-black text-red-900">{diasArrasados}</span>
                </div>
              </div>

              <div className="bg-white p-3 md:p-4 rounded-xl border border-slate-200 shadow-sm">
                <h3 className="font-black mb-3 text-slate-800 uppercase text-xs flex items-center gap-2">
                  <PlaneTakeoff size={14}/> 2. Personales
                </h3>

                <label className="block text-[10px] md:text-[11px] font-bold text-slate-500 mb-1">Grupo de Descanso:</label>
                <select value={restGroup} onChange={e=>setRestGroup(parseInt(e.target.value))}
                        className="w-full mb-2 p-1.5 md:p-2 text-xs border rounded-lg bg-slate-50 font-bold text-slate-700 border-slate-200">
                  {[1,2,3,4].map(g=><option key={g} value={g}>Grupo {g} (Patrón 28 días)</option>)}
                </select>

                <label className="block text-[10px] md:text-[11px] font-bold text-slate-500 mb-1">Grupo Verano año anterior:</label>
                <select value={groupLastYear} onChange={e=>setGroupLastYear(parseInt(e.target.value))}
                        className="w-full mb-2 p-1.5 md:p-2 text-xs border rounded-lg bg-slate-50 font-bold text-slate-700 border-slate-200">
                  <option value={1}>Grupo 1 (Jun/Jul)</option>
                  <option value={2}>Grupo 2 (Agosto)</option>
                  <option value={3}>Grupo 3 (Septiembre)</option>
                  <option value={4}>Grupo 4 (Jul/Ago)</option>
                  <option value={5}>Grupo 5 (A elegir)</option>
                </select>

                <div className="bg-yellow-50 p-2 md:p-3 rounded-lg border border-yellow-200 mb-2">
                  <span className="text-[9px] md:text-[10px] font-bold text-yellow-800 uppercase block mb-0.5">Te toca en {selectedYear}:</span>
                  <div className="font-black text-yellow-900 text-xs md:text-sm leading-tight">{sumVacName}</div>
                  {groupCurrentYear===5 && (
                    <select value={subGroup5} onChange={e=>setSubGroup5(e.target.value)}
                            className="w-full mt-2 p-1 text-[10px] md:text-xs border rounded bg-white font-bold text-yellow-900 border-yellow-300">
                      <option value="S51">S5.1: 1/Ago - 30/Ago</option>
                      <option value="S52">S5.2: 1/Jul - 30/Jul</option>
                      <option value="S53">S5.3: 1/Sep - 30/Sep</option>
                    </select>
                  )}
                </div>

                <label className="block text-[10px] md:text-[11px] font-bold text-slate-500 mb-1">Inviernos:</label>
                <select value={winVac} onChange={e=>setWinVac(e.target.value)}
                        className="w-full p-1.5 md:p-2 text-xs border rounded-lg bg-yellow-50 font-bold text-yellow-900 border-yellow-200">
                  {VACATIONS.winter.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
                </select>

                <div className="mt-3 bg-slate-50 p-2 md:p-3 rounded-lg border border-slate-200 shadow-inner">
                  <p className="text-[10px] text-slate-500 mb-2 font-bold text-center">¿Fraccionas vacaciones (quincenas / días sueltos)?</p>
                  <button onClick={() => setClickMode(clickMode === 'vacaciones' ? 'pedir' : 'vacaciones')} 
                          className={`w-full py-1.5 flex items-center justify-center gap-2 rounded-lg font-black text-xs transition-all shadow-sm ${clickMode === 'vacaciones' ? 'bg-yellow-400 text-yellow-900 border-2 border-yellow-500 scale-105' : 'bg-white text-slate-700 hover:bg-slate-100 border border-slate-300'}`}>
                    <Edit3 size={14}/> {clickMode==='vacaciones'?'Terminar Edición (Guardar)':'Editar Días en el Calendario'}
                  </button>
                  {clickMode==='vacaciones' && <p className="text-[9px] md:text-[10px] text-yellow-700 font-bold mt-2 text-center animate-pulse">Haz clic en los días del calendario para sumar o restar VAC.</p>}
                </div>
              </div>

              <div className="bg-blue-50 p-3 md:p-5 rounded-xl border border-blue-200 shadow-sm">
                <h3 className="font-black text-blue-900 uppercase tracking-wide text-xs mb-2 md:mb-3">3. Cómputo Anual</h3>
                <div className="flex justify-between items-end mb-3 md:mb-4">
                  <div>
                    <span className="font-bold text-blue-900 text-sm md:text-base">Crédito Libre:</span>
                    <span className="text-[10px] md:text-xs text-blue-600 block">Pide donde quieras</span>
                  </div>
                  <span className="text-2xl md:text-3xl font-black text-blue-700">{Math.floor(stats.credit)} <span className="text-[10px] md:text-sm">días</span></span>
                </div>
                <div className="bg-white p-2 md:p-3 rounded-lg border border-orange-200">
                  <h4 className="text-[10px] md:text-xs font-black text-orange-800 uppercase mb-1 md:mb-2">Regla 7 L-V</h4>
                  <div className="flex justify-between text-xs md:text-sm mb-1">
                    <span className="font-bold text-slate-600">Obligatorios L-V:</span>
                    <span className="font-black text-red-600">{Math.floor(stats.obligatoryLV)}</span>
                  </div>
                  <div className="flex justify-between text-xs md:text-sm">
                    <span className="font-bold text-slate-600">Libres (S-D/L-V):</span>
                    <span className="font-black text-green-600">{Math.floor(stats.freeSD)}</span>
                  </div>
                </div>
              </div>
            </div>

            <div className="bg-white p-3 md:p-4 rounded-xl border border-slate-200 shadow-sm">
              <h3 className="font-black mb-2 md:mb-3 text-slate-800 uppercase text-[10px] md:text-xs flex items-center gap-2">
                <LayoutGrid size={14}/> 4. Estado Petición
              </h3>
              <div className="flex justify-between font-bold text-xs md:text-sm mb-1.5 md:mb-2">
                <span className="text-slate-500">L-V: <span className="text-blue-600">{reqStats.usedLV}</span>/{Math.floor(stats.obligatoryLV)}</span>
                <span className="text-slate-500">S-D: <span className="text-green-600">{reqStats.usedSD}</span>/{Math.floor(stats.freeSD)}</span>
              </div>
              <div className="w-full bg-slate-100 rounded-full h-2 md:h-3 border border-slate-200 overflow-hidden">
                <div className="bg-blue-500 h-full rounded-full transition-all duration-300"
                     style={{width:`${stats.grossCredit>0?(reqStats.total/Math.floor(stats.grossCredit))*100:0}%`}} />
              </div>
              {healthScore !== null && (
                <div className={`mt-2 p-2 rounded-lg text-[10px] font-bold flex items-center gap-2 ${healthScore>50?'bg-red-50 text-red-700 border border-red-200':healthScore>25?'bg-orange-50 text-orange-700 border border-orange-200':'bg-green-50 text-green-700 border border-green-200'}`}>
                  {healthScore>50?'🔥':healthScore>25?'⚠️':'✅'} Salud: {100-healthScore}% días buenos / {healthScore}% alta demanda
                </div>
              )}
              {planAQuota0 > 0 && (
                <div className="mt-2 p-2 rounded-lg text-[10px] font-bold bg-yellow-50 text-yellow-800 border border-yellow-300 flex items-center gap-2">
                  <AlertCircle size={12} className="text-yellow-600 flex-shrink-0"/>
                  Plan A: {planAQuota0} día{planAQuota0>1?'s':''} con cupo agotado en T{currentTurn}
                </div>
              )}
            </div>

            <div className="bg-amber-50 p-3 md:p-4 rounded-xl border border-amber-200 shadow-sm relative overflow-hidden">
               <h3 className="font-black mb-2 md:mb-3 text-amber-900 uppercase text-[10px] md:text-xs flex items-center gap-2">
                 <CalendarCheck size={14}/> 5. Asistente Cronológico ({selectedYear})
               </h3>
               
               <div className="flex gap-2 mb-3">
                 <div className="flex-1">
                   <label className="block text-[9px] md:text-[10px] uppercase font-bold text-amber-700 mb-1">Día (Ene)</label>
                   <select value={appDay} onChange={e=>setAppDay(parseInt(e.target.value))} className="w-full border rounded p-1 text-xs font-bold bg-white text-amber-900 border-amber-300">
                     {[22,23,24,25,26,27].map(d=><option key={d} value={d}>{d}</option>)}
                   </select>
                 </div>
                 <div className="flex-1">
                   <label className="block text-[9px] md:text-[10px] uppercase font-bold text-amber-700 mb-1">Hora</label>
                   <input type="time" value={appTime} onChange={e=>setAppTime(e.target.value)} className="w-full border rounded p-1 px-2 text-xs font-bold bg-white text-amber-900 border-amber-300" />
                 </div>
               </div>

               <div className="text-[10px] font-bold text-slate-500 border-l-2 border-amber-200 ml-2 pl-3 py-1 flex flex-col gap-1.5 relative mb-2">
                  <div className={`relative ${effectiveNow >= new Date(selectedYear,0,15) && effectiveNow < new Date(selectedYear,0,20) ? 'text-amber-700 font-black text-[11px]' : ''}`}>
                    <div className={`absolute -left-[17px] top-1 w-2.5 h-2.5 rounded-full ${effectiveNow >= new Date(selectedYear,0,15) && effectiveNow < new Date(selectedYear,0,20)?'bg-amber-500 ring-2 ring-amber-200':'bg-amber-200'}`} />
                    15 Ene: Listados + Reclamaciones
                  </div>
                  <div className={`relative ${(msToCita <= 300000 && msToCita > -600000) ? 'text-red-600 font-black text-xs' : ''}`}>
                    <div className={`absolute -left-[17px] top-1.5 w-2.5 h-2.5 rounded-full ${(msToCita <= 300000 && msToCita > -600000)?'bg-red-500 animate-ping':'bg-amber-200'}`} />
                    <div className={`absolute -left-[17px] top-1.5 w-2.5 h-2.5 rounded-full ${(msToCita <= 300000 && msToCita > -600000)?'bg-red-500':'bg-transparent'}`} />
                    {appDay} Ene {appTime}: Tu Cita (10 min)
                  </div>
                  <div className={`relative ${effectiveNow >= new Date(selectedYear,0,29) && effectiveNow < new Date(selectedYear,1,6) ? 'text-amber-700 font-black text-[11px]' : ''}`}>
                    <div className={`absolute -left-[17px] top-1 w-2.5 h-2.5 rounded-full ${(effectiveNow >= new Date(selectedYear,0,29) && effectiveNow < new Date(selectedYear,1,6))?'bg-amber-500':'bg-amber-200'}`} />
                    29 Ene - 5 Feb: Repesca Libre
                  </div>
                  <div className={`relative ${effectiveNow >= new Date(selectedYear,1,6) ? 'text-slate-800 font-black text-[11px]' : ''}`}>
                    <div className={`absolute -left-[17px] top-1 w-2.5 h-2.5 rounded-full ${effectiveNow >= new Date(selectedYear,1,6)?'bg-slate-800':'bg-amber-200'}`} />
                    {">"} 5 Feb: Cierre Oficial
                  </div>
               </div>

               <div className="flex gap-1 overflow-x-auto pb-1 mt-1">
